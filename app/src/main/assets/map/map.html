<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wetterkarte</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  html,body{height:100%;margin:0;background:#0b1c33}
  #map{position:fixed;inset:0}
  body{font:500 14px/1.3 -apple-system,Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  .panel{position:fixed;z-index:1000;background:rgba(28,28,30,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px}
  #layers{right:12px;display:flex;flex-direction:column;overflow:hidden}
  #layers button{all:unset;padding:11px 14px;font-size:14px;color:#fff;border-bottom:.5px solid rgba(255,255,255,.14)}
  #layers button:last-child{border-bottom:0}
  #layers button.on{background:#0a84ff}
  #timeline{left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:10px 14px}
  #play{all:unset;width:30px;height:30px;display:grid;place-items:center;font-size:17px}
  #bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22);position:relative}
  #fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff;width:0}
  #when{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
  #legend{left:12px;right:12px;padding:9px 14px;display:none}
  #scale{height:7px;border-radius:4px;margin-bottom:5px}
  #ticks{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
  #status{left:50%;transform:translateX(-50%);padding:8px 13px;font-size:13px;display:none;white-space:nowrap}
  .temp{color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.65);text-align:center}
  .me{width:16px;height:16px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-sizing:border-box;box-shadow:0 0 0 8px rgba(10,132,255,.22);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,132,255,.5)}100%{box-shadow:0 0 0 22px rgba(10,132,255,0)}}
  #wind{position:fixed;inset:0;z-index:450;pointer-events:none}
  .leaflet-container{background:#0b1c33}
  .leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.4)!important;color:#ddd}
  .leaflet-control-attribution a{color:#ddd}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="wind"></canvas>
<div id="layers" class="panel">
  <button data-l="rain" class="on">Niederschlag</button>
  <button data-l="temp">Temperatur</button>
  <button data-l="wind">Wind</button>
</div>
<div id="status" class="panel"></div>
<div id="timeline" class="panel">
  <button id="play" aria-label="Abspielen">❚❚</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="when">–</div>
</div>
<div id="legend" class="panel"><div id="scale"></div><div id="ticks"></div></div>
<script src="leaflet.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let map, layer = 'rain', me;

/* ---------- Start: wird von der App mit Ort und Randabstaenden aufgerufen ---------- */
function start(lat, lon, top = 0, bottom = 0) {
  if (map) { map.setView([lat, lon]); return; }
  $('layers').style.top = (top + 10) + 'px';
  $('status').style.top = (top + 12) + 'px';
  $('timeline').style.bottom = $('legend').style.bottom = (bottom + 22) + 'px';
  map = L.map('map', {zoomControl: false, attributionControl: true, maxZoom: 12, minZoom: 3, zoomSnap: .5}).setView([lat, lon], 7);
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 12,
    attribution: '© OpenStreetMap, © CARTO, RainViewer, Open-Meteo'
  }).addTo(map);
  me = L.marker([lat, lon], {interactive: false, icon: L.divIcon({className: '', html: '<div class="me"></div>', iconSize: [16, 16]})}).addTo(map);
  map.on('moveend', () => { if (layer !== 'rain') scheduleGrid(); });
  map.on('movestart zoomstart', () => { particles = []; if (windCtx) windCtx.clearRect(0, 0, 9999, 9999); });
  document.querySelectorAll('#layers button').forEach(b => b.onclick = () => select(b.dataset.l));
  $('play').onclick = togglePlay;
  $('bar').onclick = e => { const r = $('bar').getBoundingClientRect(); pause(); show(Math.round((e.clientX - r.left) / r.width * (frames.length - 1))); };
  addEventListener('resize', fitCanvas);
  fitCanvas();
  console.log('start', innerWidth, innerHeight, map.getSize().x, map.getSize().y, typeof L);
  loadRadar();
  // Falls die Seite vor dem ersten Layout startet, kennt Leaflet die echte Groesse noch nicht
  new ResizeObserver(() => map.invalidateSize()).observe($('map'));
}

function select(l) {
  if (l === layer) return;
  layer = l;
  document.querySelectorAll('#layers button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  const radar = l === 'rain';
  $('timeline').style.display = radar ? 'flex' : 'none';
  $('legend').style.display = radar ? 'none' : 'block';
  frames.forEach(f => f.layer.setOpacity(0));
  if (radar) { removeGrid(); show(index); play(); }
  else { pause(); legend(l); drawGrid(); scheduleGrid(0); }
}

function status(t) { const s = $('status'); s.textContent = t || ''; s.style.display = t ? 'block' : 'none'; }

/* ---------- Radar: RainViewer, letzte 2 Stunden. Oberhalb von Zoom 7 skaliert Leaflet hoch. ---------- */
let frames = [], index = 0, timer = null;
async function loadRadar() {
  try {
    const r = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    if (!r.ok) throw 0;
    const d = await r.json();
    frames = d.radar.past.map(f => ({
      time: f.time,
      layer: L.tileLayer(`${d.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, {maxNativeZoom: 7, maxZoom: 12, opacity: 0, zIndex: 300}).addTo(map)
    }));
    show(frames.length - 1);
    if (layer === 'rain') play();
  } catch (e) { status('Radar gerade nicht erreichbar'); }
}
function show(i) {
  if (!frames.length) return;
  index = (i + frames.length) % frames.length;
  frames.forEach((f, k) => f.layer.setOpacity(k === index && layer === 'rain' ? .78 : 0));
  $('fill').style.width = (frames.length > 1 ? index / (frames.length - 1) * 100 : 100) + '%';
  $('when').textContent = new Date(frames[index].time * 1000).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
}
function play() { clearInterval(timer); timer = setInterval(() => show(index + 1), 650); $('play').textContent = '❚❚'; }
function pause() { clearInterval(timer); timer = null; $('play').textContent = '▶'; }
function togglePlay() { timer ? pause() : play(); }

/* ---------- Temperatur und Wind: Modellwerte auf einem Raster ueber dem sichtbaren Ausschnitt ---------- */
const COLS = 6, ROWS = 9;
const STOPS = [[-20,[110,60,200]],[-10,[142,124,255]],[0,[92,200,250]],[10,[127,227,180]],[18,[184,227,106]],[23,[255,216,74]],[29,[255,166,61]],[36,[242,85,75]],[44,[160,20,60]]];
function tempRgb(t) {
  if (t <= STOPS[0][0]) return STOPS[0][1];
  for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) {
    const [a, ca] = STOPS[i-1], [b, cb] = STOPS[i], k = (t - a) / (b - a);
    return ca.map((v, c) => v + (cb[c] - v) * k);
  }
  return STOPS[STOPS.length - 1][1];
}
function windRgb(v) {
  const s = [[0,[60,120,200]],[15,[70,190,190]],[30,[120,220,120]],[50,[250,210,80]],[75,[245,120,60]],[100,[210,50,90]]];
  if (v >= 100) return s[5][1];
  for (let i = 1; i < s.length; i++) if (v <= s[i][0]) {
    const [a, ca] = s[i-1], [b, cb] = s[i], k = (v - a) / (b - a);
    return ca.map((x, c) => x + (cb[c] - x) * k);
  }
}
function legend(l) {
  const css = l === 'temp' ? STOPS.slice(1, 8).map(s => `rgb(${s[1]})`) : [0, 25, 50, 75, 100].map(v => `rgb(${windRgb(v)})`);
  $('scale').style.background = `linear-gradient(90deg,${css.join(',')})`;
  $('ticks').innerHTML = (l === 'temp' ? ['-10°','10°','23°','36°'] : ['0','25','50','75','100 km/h']).map(t => `<span>${t}</span>`).join('');
}

let grid = null, overlay = null, labels = [], lastBounds = null, gridTimer = null, gridSeq = 0;
function scheduleGrid(ms = 900) { clearTimeout(gridTimer); gridTimer = setTimeout(loadGrid, ms); }

async function loadGrid() {
  const b = map.getBounds();
  if (lastBounds && lastBounds.contains(b) && lastBounds.getNorth() - lastBounds.getSouth() < (b.getNorth() - b.getSouth()) * 2) { return; }
  const pad = b.pad(.15), south = pad.getSouth(), north = pad.getNorth(), west = pad.getWest(), east = pad.getEast();
  const lats = [], lons = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    lats.push((north - (north - south) * r / (ROWS - 1)).toFixed(3));
    lons.push((west + (east - west) * c / (COLS - 1)).toFixed(3));
  }
  const seq = ++gridSeq;
  status('Lade Modelldaten …');
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,wind_speed_10m,wind_direction_10m`);
    if (!r.ok) throw 0;
    const d = await r.json();
    if (seq !== gridSeq) return;
    const list = Array.isArray(d) ? d : [d];
    const pick = k => list.map(x => x.current[k]);
    grid = {south, north, west, east, t: pick('temperature_2m'), s: pick('wind_speed_10m'), d: pick('wind_direction_10m')};
    lastBounds = pad;
    status('');
    drawGrid();
  } catch (e) { status('Modelldaten gerade nicht erreichbar'); }
}

function removeGrid() {
  if (overlay) { overlay.remove(); overlay = null; }
  labels.forEach(m => m.remove()); labels = [];
  particles = [];
  if (windCtx) windCtx.clearRect(0, 0, $('wind').width, $('wind').height);
}

function drawGrid() {
  removeGrid();
  if (!grid || layer === 'rain') return;
  // Rasterwerte in ein winziges Bild schreiben; das Hochskalieren glaettet die Flaeche.
  const small = document.createElement('canvas'); small.width = COLS; small.height = ROWS;
  const sc = small.getContext('2d'), img = sc.createImageData(COLS, ROWS);
  const vals = layer === 'temp' ? grid.t : grid.s, rgb = layer === 'temp' ? tempRgb : windRgb;
  vals.forEach((v, i) => {
    const c = rgb(v ?? 0);
    img.data.set([c[0], c[1], c[2], 255], i * 4);
  });
  sc.putImageData(img, 0, 0);
  const big = document.createElement('canvas'); big.width = 300; big.height = 450;
  const bc = big.getContext('2d'); bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high';
  // Halbes Pixel Rand wegschneiden, damit Werte auf den Rasterpunkten liegen
  bc.drawImage(small, .5, .5, COLS - 1, ROWS - 1, 0, 0, 300, 450);
  overlay = L.imageOverlay(big.toDataURL(), [[grid.south, grid.west], [grid.north, grid.east]], {opacity: .62, zIndex: 300}).addTo(map);
  if (layer === 'temp') {
    for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
      if ((r + c) % 2) continue;
      const v = grid.t[r * COLS + c];
      if (v == null) continue;
      const lat = grid.north - (grid.north - grid.south) * r / (ROWS - 1), lon = grid.west + (grid.east - grid.west) * c / (COLS - 1);
      labels.push(L.marker([lat, lon], {interactive: false, icon: L.divIcon({className: 'temp', html: Math.round(v) + '°', iconSize: [40, 18]})}).addTo(map));
    }
  }
  if (layer === 'wind') seedParticles();
}

/* ---------- Wind-Partikel: fliessen mit dem interpolierten Windfeld ---------- */
let windCtx = null, particles = [];
function fitCanvas() {
  const c = $('wind'), ratio = Math.min(devicePixelRatio || 1, 2);
  c.width = innerWidth * ratio; c.height = innerHeight * ratio;
  windCtx = c.getContext('2d'); windCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
function windAt(lat, lon) {
  if (!grid) return null;
  const fx = (lon - grid.west) / (grid.east - grid.west) * (COLS - 1), fy = (grid.north - lat) / (grid.north - grid.south) * (ROWS - 1);
  if (fx < 0 || fy < 0 || fx >= COLS - 1 || fy >= ROWS - 1) return null;
  const x = fx | 0, y = fy | 0, kx = fx - x, ky = fy - y;
  // u/v statt Betrag und Richtung mischen, sonst dreht der Wind bei 350°/10° falsch herum
  const uv = (cx, cy) => {
    const i = cy * COLS + cx, s = grid.s[i] ?? 0, d = (grid.d[i] ?? 0) * Math.PI / 180;
    return [-s * Math.sin(d), -s * Math.cos(d)];
  };
  const a = uv(x, y), b = uv(x + 1, y), c = uv(x, y + 1), e = uv(x + 1, y + 1);
  const m = (p, q, k) => p + (q - p) * k;
  return [m(m(a[0], b[0], kx), m(c[0], e[0], kx), ky), m(m(a[1], b[1], kx), m(c[1], e[1], kx), ky)];
}
function seedParticles() {
  particles = Array.from({length: 420}, () => ({x: Math.random() * innerWidth, y: Math.random() * innerHeight, age: Math.random() * 90}));
}
function stepWind() {
  requestAnimationFrame(stepWind);
  if (layer !== 'wind' || !windCtx || !particles.length || !map) return;
  windCtx.globalCompositeOperation = 'destination-in';
  windCtx.fillStyle = 'rgba(0,0,0,.93)';
  windCtx.fillRect(0, 0, innerWidth, innerHeight);
  windCtx.globalCompositeOperation = 'source-over';
  windCtx.strokeStyle = 'rgba(255,255,255,.8)';
  windCtx.lineWidth = 1.3;
  windCtx.beginPath();
  for (const p of particles) {
    const ll = map.containerPointToLatLng([p.x, p.y]), v = windAt(ll.lat, ll.lng);
    if (!v || ++p.age > 100) {
      p.x = Math.random() * innerWidth; p.y = Math.random() * innerHeight; p.age = Math.random() * 40;
      continue;
    }
    const nx = p.x + v[0] * .1, ny = p.y - v[1] * .1;
    windCtx.moveTo(p.x, p.y); windCtx.lineTo(nx, ny);
    p.x = nx; p.y = ny;
  }
  windCtx.stroke();
}
requestAnimationFrame(stepWind);
</script>
</body>
</html>

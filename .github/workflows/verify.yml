name: Emulator-Pruefung

on:
  workflow_dispatch:
  push:
    branches: [ verify ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App im Emulator pruefen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 8.8.8.8
          script: timeout 3300 bash tools/ci/verify.sh

      - name: Ergebnis bereitstellen
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: verify
          name: Emulator-Pruefung
          prerelease: true
          files: out/verify.zip

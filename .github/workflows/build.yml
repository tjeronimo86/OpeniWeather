name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # --stacktrace zeigt bei Kompilierfehlern die betroffene Datei und Zeile
      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             out/openiweather-${{ github.run_number }}.apk

      - name: Update-Verlauf lesen
        id: notes
        run: echo "version=$(python3 tools/ci/release_notes.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wetter-apk
          path: out/*.apk

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpeniWeather ${{ steps.notes.outputs.version }} (Build ${{ github.run_number }})
          body_path: out/notes.md
          make_latest: true
          files: out/*.apk

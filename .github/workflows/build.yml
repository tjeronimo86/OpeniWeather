name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # --stacktrace zeigt bei Kompilierfehlern die betroffene Datei und Zeile
      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             out/wetter-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wetter-apk
          path: out/*.apk

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wetter Build ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
